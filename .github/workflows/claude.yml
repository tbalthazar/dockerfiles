name: Build claude image

on:
  push:
    branches: [ main ]
    paths:
    - "claude/**"

  # Run every Sunday at 23:00 UTC
  # Cron format: minute hour day-of-month month day-of-week
  # 0 23 * * 0  →  at 23:00, on Sunday (0), every month, every day-of-month
  schedule:
    - cron: "0 23 * * 0"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t tbalthazar/claude-code-dev:latest claude
        
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          username: tbalthazar
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Push image
        run: docker push tbalthazar/claude-code-dev:latest
